<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyjątkowy Dzień 🎂✨</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-y: auto;
    overflow-x: hidden;
    background: linear-gradient(135deg, #312e81, #4f46e5, #7c3aed, #8b5cf6);
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    padding: 20px 10px;
}

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    filter: blur(30px);
    animation: float 8s infinite ease-in-out;
    pointer-events: none;
}

.glow:nth-child(1) { top: -100px; left: -100px; }
.glow:nth-child(2) { bottom: -120px; right: -80px; animation-delay: 2s; }
.glow:nth-child(3) { top: 30%; right: 10%; width: 150px; height: 150px; animation-delay: 4s; }

@keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(20px, -30px); }
}

.back-to-lobby {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
    z-index: 20;
}

.back-to-lobby:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
}

/* UKŁAD GŁÓWNY (RESPONSYWNY) */
.page-layout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 160px;
    width: 100%;
    max-width: 1500px;
    position: relative;
    z-index: 10;
    flex-wrap: wrap;
    padding: 40px 10px;
}

.main-card {
    width: 100%;
    max-width: 480px;
    padding: 50px 30px 40px;
    text-align: center;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    animation: fadeIn 0.5s ease forwards;
    flex-shrink: 0;
    z-index: 10;
}

.card-icon {
    font-size: 50px;
    margin-bottom: 15px;
    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

h1 {
    color: white;
    font-size: 26px;
    margin-bottom: 15px;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

p {
    color: rgba(255, 255, 255, 0.85);
    font-size: 16px;
    margin-bottom: 30px;
    line-height: 1.5;
}

/* POLA WSTĘPNEJ WERYFIKACJI */
.gate-input {
    width: 100%;
    padding: 14px 20px;
    font-size: 18px;
    border-radius: 50px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.9);
    outline: none;
    text-align: center;
    color: #312e81;
    font-weight: bold;
    margin-bottom: 20px;
}

.gate-input:focus {
    border-color: #a855f7;
}

.wrong-text {
    color: #ffb4b4;
    font-size: 16px;
    font-weight: bold;
    margin-top: 15px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    display: none;
}

.buttons-group {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.action-btn {
    border: none;
    padding: 14px 36px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.action-btn.yes {
    color: white;
    background: linear-gradient(135deg, #6366f1, #a855f7);
}

.action-btn.no {
    color: #4f46e5;
    background: rgba(255, 255, 255, 0.95);
}

.action-btn:hover {
    transform: translateY(-4px) scale(1.05);
}

/* WACHLARZ ZDJĘĆ */
.card-stack-container {
    width: 280px;
    height: 370px;
    position: relative;
    cursor: pointer;
    display: none;
    animation: fadeIn 0.8s ease forwards;
    flex-shrink: 0;
    z-index: 15;
}

.stack-card {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.card-left {
    z-index: 1;
    transform: translateX(0) rotate(0deg);
    border-color: rgba(56, 189, 248, 0.8);
}

.card-main {
    z-index: 3;
    transform: translateX(0) rotate(0deg);
}

.card-right {
    z-index: 2;
    transform: translateX(0) rotate(0deg);
    border-color: rgba(236, 72, 153, 0.8);
}

.card-stack-container:hover .card-left {
    transform: translateX(-160px) rotate(-20deg) scale(0.96);
}

.card-stack-container:hover .card-main {
    transform: translateY(-12px) scale(1.03);
    z-index: 6;
}

.card-stack-container:hover .card-right {
    transform: translateX(160px) rotate(20deg) scale(0.96);
}

.confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    top: -20px;
    z-index: 999;
    animation: fall linear forwards;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 1300px) {
    .page-layout {
        gap: 40px;
        flex-direction: column;
    }
    .card-stack-container {
        margin-top: 10px;
        margin-bottom: 10px;
        display: none;
    }
}
</style>
</head>
<body>

<audio id="birthdayMusic" loop>
    <source src="urodziny.mp3" type="audio/mpeg">
</audio>

<div class="glow"></div>
<div class="glow"></div>
<div class="glow"></div>

<button class="back-to-lobby" onclick="window.location.href='sekretne archiwum.html'">← Menu</button>

<div class="page-layout">
    <!-- LEWA TALIA KART -->
    <div class="card-stack-container" id="leftStack">
        <img src="autochibi.jpg" class="stack-card card-left" alt="Sekretne lewe 1" onclick="swapCard(this, 'leftStack')">
        <img src="pociag.jpg" class="stack-card card-main" alt="Główne lewe" onclick="swapCard(this, 'leftStack')">
        <img src="gamingchibi.jpg" class="stack-card card-right" alt="Sekretne lewe 2" onclick="swapCard(this, 'leftStack')">
    </div>

    <!-- GŁÓWNY KAFELEK -->
    <div class="main-card" id="mainCard">
        <!-- KROK 1: WSTĘPNA WERYFIKACJA -->
        <div id="verificationStep">
            <div class="card-icon">🔒</div>
            <h1>Autoryzacja Dstępu</h1>
            <p>Podaj swoje imię oraz wyjątkową datę (dzień i miesiąc), aby przejść dalej.</p>
            
            <input type="text" id="nameInput" class="gate-input" placeholder="Wpisz imię" autocomplete="off">
            <input type="text" id="dateInput" class="gate-input" placeholder="Data" autocomplete="off">
            
            <button class="action-btn yes" onclick="verifyUser()">Sprawdź 💙</button>
            <div class="wrong-text" id="wrongText">Błędne dane... spróbuj ponownie! 🙈</div>
        </div>

        <!-- KROK 2: WŁAŚCIWA TREŚĆ (UKRYTA DO MOMENTU WERYFIKACJI) -->
        <div id="contentStep" style="display: none;">
            <div class="card-icon" id="cardIcon">🤔</div>
            <h1 id="cardTitle">Czy wiesz jaki jest dziś dzień?</h1>
            <p id="cardDesc">Pomyśl dobrze... odpowiedź jest tylko jedna! ✨</p>
            
            <div class="buttons-group" id="buttonsGroup">
                <button class="action-btn yes" onclick="handleYes()">TAK 💙</button>
                <button class="action-btn no" onclick="handleNo()">NIE 🙈</button>
            </div>
        </div>
    </div>

    <!-- PRAWA TALIA KART -->
    <div class="card-stack-container" id="rightStack">
        <img src="sukienkachibi.jpg" class="stack-card card-left" alt="Sekretne prawe 1" onclick="swapCard(this, 'rightStack')">
        <img src="lustro.jpg" class="stack-card card-main" alt="Główne prawe" onclick="swapCard(this, 'rightStack')">
        <img src="lozkochibi.jpg" class="stack-card card-right" alt="Sekretne prawe 2" onclick="swapCard(this, 'rightStack')">
    </div>
</div>

<script>
// FUNKCJA WERYFIKACJI IMIENIA I DATY
function verifyUser() {
    const nameInput = document.getElementById("nameInput").value.trim().toLowerCase();
    const dateInput = document.getElementById("dateInput").value.trim().toLowerCase();
    const wrongText = document.getElementById("wrongText");

    const validNames = ["magda", "madzia", "magdalena", "madziula", "madziulka", "madzix", "magdalenka", "madziuluńka", "madziuluś", "madziunia","madziuś"];
    const validDates = ["06.10", "6.10", "6 października", "06 października","szósty października","szósty 10", "szósty dziesiąty","610","6 10"];

    const isNameValid = validNames.includes(nameInput);
    const isDateValid = validDates.includes(dateInput);

    if (isNameValid && isDateValid) {
        wrongText.style.display = "none";
        // Przechodzimy do pytania
        document.getElementById("verificationStep").style.display = "none";
        document.getElementById("contentStep").style.display = "block";
    } else {
        wrongText.style.display = "block";
    }
}

function handleYes() {
    const cardIcon = document.getElementById("cardIcon");
    const cardTitle = document.getElementById("cardTitle");
    const cardDesc = document.getElementById("cardDesc");
    const buttonsGroup = document.getElementById("buttonsGroup");
    const leftStack = document.getElementById("leftStack");
    const rightStack = document.getElementById("rightStack");

    cardIcon.innerHTML = "🎉🎂";
    cardTitle.innerHTML = "Dziś są Twoje urodziny! 🥳";
    cardDesc.innerHTML = "Wszystkiego najlepszego Madziuluś, spełnienia marzeń! 💙💜<br><small style='opacity:0.8;'>Oby każdy dzień przynosił Ci mnóstwo uśmiechu i radości.</small>";

    buttonsGroup.innerHTML = `
        <button class="action-btn yes" onclick="triggerCelebration()">Wystrzel konfetti! ✨</button>
    `;

    leftStack.style.display = "block";
    rightStack.style.display = "block";

    playMusic();
    createConfetti();
}

function handleNo() {
    const cardIcon = document.getElementById("cardIcon");
    const cardTitle = document.getElementById("cardTitle");
    const cardDesc = document.getElementById("cardDesc");
    const buttonsGroup = document.getElementById("buttonsGroup");

    cardIcon.innerHTML = "😢";
    cardTitle.innerHTML = "Jak to nie wiesz, co jest dziś za dzień?!";
    cardDesc.innerHTML = "To przecież niesamowicie ważny moment... Zastanów się jeszcze raz! 🥺";
    
    buttonsGroup.innerHTML = `<p style="font-size: 14px; opacity: 0.7; margin: 0;">Chwila refleksji...</p>`;

    setTimeout(() => {
        buttonsGroup.innerHTML = `
            <button class="action-btn yes" onclick="handleYes()">Przypomnę ci 😊</button>
        `;
    }, 5000);
}

// ZAMIANA MIEJSC KART PO KLIKNIĘCIU
function swapCard(clickedCard, stackId) {
    const stack = document.getElementById(stackId);
    const mainCard = stack.querySelector('.card-main');

    if (clickedCard === mainCard) return;

    const tempSrc = mainCard.src;
    const tempAlt = mainCard.alt;

    mainCard.src = clickedCard.src;
    mainCard.alt = clickedCard.alt;

    clickedCard.src = tempSrc;
    clickedCard.alt = tempAlt;
}

function playMusic() {
    const music = document.getElementById("birthdayMusic");
    music.volume = 0.3;
    music.play().catch(() => {});
}

function triggerCelebration() {
    createConfetti();
    playMusic();
}

function createConfetti() {
    const colors = ["#6366f1", "#8b5cf6", "#a855f7", "#ffffff", "#ec4899", "#60a5fa"];
    for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = 2 + Math.random() * 3 + "s";
        confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
        document.body.appendChild(confetti);
        setTimeout(() => { confetti.remove(); }, 5000);
    }
}
</script>

</body>
</html>
